  - "file/CV/*.log"
  - "file/CV/*.bcf"
  - "file/CV/*.blg"
  - "file/CV/*.bbl"
  - "file/CV/*.out"
  - "file/CV/*.toc"
  - "file/CV/*.run.xml"
