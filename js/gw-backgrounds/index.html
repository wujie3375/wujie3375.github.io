<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confusion Foreground</title><link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="animation-frame">
    <canvas id="gw-backgrounds-source" aria-label="Galactic double white dwarf binaries orbit at fixed barycenters and emit soft expanding gravitational-wave fronts."></canvas>
    <canvas id="gw-backgrounds-strain" class="foreground-overlay" aria-label="Forty-eight monochromatic source components and their sum."></canvas>
    <div class="animation-labels">Confusion Foreground</div>
    <p class="animation-error" hidden>Animation unavailable. A browser with WebGL2 is required.</p>
  </main>
  <script type="module" src="./src/standalone.js"></script>
</body>
</html>
