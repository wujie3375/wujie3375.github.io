<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AGN Hierarchical Triple</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="animation-frame">
    <canvas id="moving-sources-canvas" aria-label="Keplerian hierarchical triple in an AGN disk"></canvas>
    <canvas id="moving-sources-strain" class="triple-waveform-overlay" aria-label="One early-inspiral GW signal with visually enhanced Doppler modulation from the outer Kepler orbit."></canvas>
    <div class="animation-labels" aria-hidden="true">
      <div>Hierarchical Triple</div>
    </div>
    <p class="animation-error" hidden>Animation unavailable. A browser with WebGL2 is required.</p>
  </main>
  <script type="module" src="./src/standalone.js"></script>
</body>
</html>
