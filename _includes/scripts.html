<!-- 保留灯箱/视频功能，但只在页面实际使用时加载本地旧插件。 -->
{% assign legacy_script = site.static_files | where: 'path', '/assets/js/legacy-enhancements.js' | first %}
{% assign main_script = site.static_files | where: 'path', '/assets/js/main.min.js' | first %}
<script src="{{ '/assets/js/legacy-enhancements.js' | relative_url }}?v={{ legacy_script.modified_time | date: '%s' }}"
        data-jquery-url="{{ '/assets/js/vendor/jquery-1.9.1.min.js' | relative_url }}"
        data-main-url="{{ '/assets/js/main.min.js' | relative_url }}?v={{ main_script.modified_time | date: '%s' }}"
        defer></script>
