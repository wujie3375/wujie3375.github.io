<div class="author-profile">
  <img src="{{ '/images/' | append: site.owner.avatar | relative_url }}"
       class="bio-photo"
       alt="{{ site.owner.name }} bio photo"
       width="220">

  <div class="profile-identity">
    <h3>{{ site.owner.name }}</h3>
    <div class="profile-bio">{{ site.owner.bio | strip | newline_to_br }}</div>
  </div>

  <div class="profile-links">
    <div class="profile-links__group">
      <div class="profile-row profile-location">
        <span class="profile-icon-column" aria-hidden="true"><img class="profile-icon" src="{{ '/images/logo/icons8-location-100.png' | relative_url }}" alt=""></span>
        <span>{{ site.owner.location }}</span>
      </div>
    <a class="profile-row" href="mailto:{{ site.owner.email }}">
      <span class="profile-icon-column" aria-hidden="true"><img class="profile-icon" src="{{ '/images/logo/icons8-email-100.png' | relative_url }}" alt=""></span>
      <span>{{ site.owner.email }}</span>
    </a>
      <a class="profile-row profile-cv" href="{{ site.owner.cv }}">
        <span class="profile-icon-column" aria-hidden="true"><img class="profile-icon profile-icon--cv" src="{{ '/images/logo/icons8-cv.png' | relative_url }}" alt=""></span>
        <span>View CV</span>
      </a>
    </div>

    <div class="profile-links__group">
    <a class="profile-row" href="{{ site.owner.inspirehep }}">
      <span class="profile-icon-column" aria-hidden="true"><img class="profile-icon profile-icon--inspire" src="{{ '/images/logo/icons8-inspirehep-100.png' | relative_url }}" alt=""></span>
      <span>INSPIRE</span>
    </a>
    <a class="profile-row" href="https://orcid.org/{{ site.owner.ORCID }}">
      <span class="profile-icon-column" aria-hidden="true"><img class="profile-icon" src="{{ '/images/logo/icons8-orcid-101.png' | relative_url }}" alt=""></span>
      <span>ORCID</span>
    </a>
    <a class="profile-row" href="{{ site.owner.scholar }}">
      <span class="profile-icon-column" aria-hidden="true"><img class="profile-icon" src="{{ '/images/logo/icons8-scholar-100.png' | relative_url }}" alt=""></span>
      <span>Google Scholar</span>
    </a>
    <a class="profile-row" href="{{ site.owner.ads }}" title="Astrophysics Data System" aria-label="Astrophysics Data System">
      <span class="profile-icon-column" aria-hidden="true"><img class="profile-icon profile-icon--ads" src="{{ '/images/logo/icons8-ads-102.png' | relative_url }}" alt=""></span>
      <span>ADS</span>
    </a>
    <a class="profile-row" href="{{ site.owner.web }}">
      <span class="profile-icon-column" aria-hidden="true"><img class="profile-icon" src="{{ '/images/logo/icons8-web-100.png' | relative_url }}" alt=""></span>
      <span>Web of Science</span>
    </a>
    <a class="profile-row" href="{{ site.owner.researchgate }}">
      <span class="profile-icon-column" aria-hidden="true"><img class="profile-icon" src="{{ '/images/logo/icons8-rg.png' | relative_url }}" alt=""></span>
      <span>ResearchGate</span>
    </a>
    </div>

  </div>
</div>
