<!-- 此文件是页面片段，不重复创建 html/head/body。 -->
  <style>
    /* 基本样式 */
    #toc {
      position: fixed;
      /* 置于正文的透明右侧占位区域之上，确保目录链接可以点击。 */
      z-index: 20;
      right: 4rem;  /* 默认右侧位置 */
      top: 9rem;  /* 默认顶部位置 */
      width: 15rem;  /* 默认宽度 */
      background-color: transparent;
      padding: 1rem;
      border: 0;
      max-height: 80vh;
      overflow-y: auto;
    }
    /* 保持原位置和宽度，弱化外框；细引导线与当前章节标记负责层级。 */
    #toc h3 { margin: 0 0 .7rem; font-size: 1.35rem; line-height: 1.3; }
    #toc-list { border-left: 1px solid #e0e4e8; }
    #toc-list a {
      display: block;
      padding: .45rem .7rem;
      margin-left: -1px;
      border-left: 2px solid transparent;
      color: #606873;
      font-size: .9rem;
      line-height: 1.4;
      text-decoration: none;
      border-radius: 0 5px 5px 0;
      transition: background-color .15s, color .15s;
    }
    #toc-list a.toc-subsection { padding-left: 1.35rem; }
    #toc-list a:hover { background: #f2f5f7; color: #286b93; }
    #toc-list a[aria-current="location"] {
      border-left-color: #286b93;
      background: #edf3f7;
      color: #286b93;
      font-weight: 600;
    }
    #toc-list a:focus-visible { outline: 2px solid #286b93; outline-offset: 2px; }

    /* 当屏幕宽度小于 1400px 时隐藏导航栏 */
    @media (max-width: 1400px) {
      #toc {
        display: none;
      }
    }

    /* 平滑滚动效果 */
    html {
      scroll-behavior: smooth;
    }
    #main h1, #main h2 {
      scroll-margin-top: 1.5rem;
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      #toc-list a { transition: none; }
    }
  </style>
  <!-- 导航栏 -->
  <div id="toc" aria-label="Contents">
    <h3>Contents</h3>
    <div id="toc-list"></div>
  </div>

  <!-- 其他内容 -->

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      var toc = document.getElementById('toc-list');
      if (!toc) return;
      var entries = [];
      var scrollPending = false;
      function updateCurrentSection() {
        if (!entries.length) return;
        // 标题越过上方阅读区域后高亮；不用轮询，也不改变原生锚点跳转。
        var threshold = Math.min(160, window.innerHeight * .2);
        var current = entries[0];
        entries.forEach(function (entry) {
          if (entry.header.getBoundingClientRect().top <= threshold) current = entry;
        });
        // 短末章可能无法滚到顶部：到达页尾时仍标记最后一个可见章节。
        var pageHeight = document.documentElement.scrollHeight;
        var last = entries[entries.length - 1];
        if (pageHeight > window.innerHeight + 1 &&
            window.scrollY + window.innerHeight >= pageHeight - 2 &&
            last.header.getBoundingClientRect().top < window.innerHeight) current = last;
        entries.forEach(function (entry) {
          if (entry === current) entry.link.setAttribute('aria-current', 'location');
          else entry.link.removeAttribute('aria-current');
        });
      }
      function buildToc() {
        var headers = document.querySelectorAll('#main h1, #main h2');
        var fragment = document.createDocumentFragment();
        entries = [];

        headers.forEach(function (header, index) {
          // 也检查父级是否隐藏，避免链接指向被筛选掉的列表。
          if (header.getClientRects().length === 0) return;
          if (!header.id) header.id = 'section-' + index;

          var link = document.createElement('a');
          link.href = '#' + header.id;
          link.textContent = header.textContent;
          if (header.tagName === 'H2') link.className = 'toc-subsection';
          entries.push({ header: header, link: link });
          fragment.appendChild(link);
        });

        toc.replaceChildren(fragment);
        updateCurrentSection();
      }
      buildToc();
      // 发表页切换全部/一作列表时同步目录，其他页面仍正常初始化。
      document.addEventListener('toc:refresh', buildToc);
      window.addEventListener('scroll', function () {
        if (scrollPending) return;
        scrollPending = true;
        window.requestAnimationFrame(function () {
          scrollPending = false;
          updateCurrentSection();
        });
      }, { passive: true });
      window.addEventListener('resize', updateCurrentSection);
    });
  </script>
